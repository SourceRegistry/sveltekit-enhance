name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel runs on release branches: killing semantic-release mid-publish can leave
  # npm published without the matching tag/changelog commit. Queue them instead.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/alpha' }}

jobs:
  test:
    name: Test and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          registry-url: "https://registry.npmjs.org/"
      - name: Use npm 11 (lockfile format; Node 22 ships npm 10)
        run: npm install -g npm@11
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build the package
        run: npm run build

  release:
    name: Release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/alpha')
    needs:
      - test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NPM_CONFIG_PROVENANCE: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org/"
      - name: Install dependencies
        run: npm ci
      - name: Restore tracked files
        run: git restore .
      - name: Build the package
        run: npm run build
      - name: Run semantic-release
        run: npx semantic-release

  deploy-docs:
    name: Deploy Docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build documentation
        run: npm run docs:build
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      # deploy-pages occasionally cannot see the just-uploaded artifact (eventual consistency)
      - name: Retry deploy to GitHub Pages
        if: steps.deploy.outcome == 'failure'
        run: sleep 20
      - name: Deploy to GitHub Pages (retry)
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
